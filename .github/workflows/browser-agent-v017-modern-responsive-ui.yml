name: LongCapture Browser Agent v0.1.7 Modern Responsive UI

on:
  push:
    branches: ["standalone/browser-agent-v0.1-poc"]
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/browser-agent-v017-modern-responsive-ui.yml"
  pull_request:
    branches: ["standalone/longcapture-v0.1.9-rc6-sparse-edge-evidence"]
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/browser-agent-v017-modern-responsive-ui.yml"
  workflow_dispatch:

concurrency:
  group: browser-agent-v017-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prebuild-quality-build-visual-audit:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Apply RC6 overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1",
            "scripts\apply-longcapture-v018-precut.ps1",
            "scripts\apply-longcapture-v018-trust-split-hooks.ps1",
            "scripts\apply-longcapture-v018-rc-evidence.ps1",
            "scripts\apply-longcapture-v019-recovery-tail-hooks.ps1",
            "scripts\apply-longcapture-v019-rc3-real-evidence-hooks.ps1",
            "scripts\apply-longcapture-v019-rc4-upward-alias-veto.ps1",
            "scripts\apply-longcapture-v019-rc5-downward-alias-consensus.ps1",
            "scripts\apply-longcapture-v019-rc6-sparse-edge-evidence.ps1",
            "scripts\apply-longcapture-v019-rc6-strong-direct-order.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Apply Browser Agent v0.1.6 plus v0.1.7 UI overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\apply-browser-agent-v01-poc.ps1",
            "scripts\apply-browser-agent-v012-integration.ps1",
            "scripts\apply-browser-agent-v013-main-ui.ps1",
            "scripts\apply-browser-agent-v013-quality-core.ps1",
            "scripts\apply-browser-agent-v013-core-followup.ps1",
            "scripts\apply-browser-agent-v014-prep.ps1",
            "scripts\apply-browser-agent-v014-cancel-timeline.ps1",
            "scripts\apply-browser-agent-v014-operation-log.ps1",
            "scripts\apply-browser-agent-v015-adaptive-quality.ps1",
            "scripts\apply-browser-agent-v015-global-speed-ui.ps1",
            "scripts\apply-browser-agent-v016-calibration-learning-v2.ps1",
            "scripts\apply-browser-agent-v017-modern-ui.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: v0.1.6 adaptive core score must remain 95+
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts\browser-agent-v016-quality-score.ps1 -MinimumScore 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: v0.1.7 pre-build UI score must be 95+
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts\browser-agent-v017-ui-quality-score.ps1 -MinimumScore 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify v0.1.7 responsive UI and security invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ui = Get-Content "LongCapture.Standalone\StandaloneUiPolish.cs" -Raw
          $program = Get-Content "LongCapture.Standalone\Program.cs" -Raw
          $manifest = Get-Content "LongCapture.Standalone\BrowserAgent\Extension\manifest.json" -Raw | ConvertFrom-Json
          foreach ($marker in @(
            'ExperienceVersion = "0.1.7"',
            'speedBar.WrapContents = true',
            'ApplyModeVisibility',
            'CaptureVisualAudit',
            'SystemInformation.HighContrast',
            'ValidateTargetStrip',
            'ValidateCheckBoxes'
          )) {
            if (-not $ui.Contains($marker)) { throw "Missing v0.1.7 UI invariant: $marker" }
          }
          if (-not $program.Contains('--modern-ui-v017-audit')) { throw "Packaged UI audit CLI overlay is missing" }
          $permissions = @($manifest.permissions)
          foreach ($permission in @("activeTab", "scripting", "nativeMessaging")) {
            if ($permissions -notcontains $permission) { throw "Missing permission $permission" }
          }
          if ($permissions.Count -ne 3 -or $permissions -contains "debugger" -or $manifest.host_permissions) {
            throw "Browser Agent permission boundary expanded unexpectedly"
          }

      - name: Restore and publish only after both 95+ gates
        shell: pwsh
        run: |
          dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deterministic UI visual audit, Browser self-test and RC6 QUICK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $audit = Join-Path $PWD "artifacts\UiAudit-v017"
          & "artifacts\LongCapture\LongCapture.exe" "--modern-ui-v017-audit=$audit"
          if ($LASTEXITCODE -ne 0) { throw "v0.1.7 packaged UI audit failed exit=$LASTEXITCODE" }
          $manifest = Join-Path $audit "ui-audit.json"
          if (-not (Test-Path $manifest)) { throw "UI audit manifest missing" }
          $shots = @(Get-ChildItem $audit -Filter "LongCapture-v017-ui-*.png")
          if ($shots.Count -ne 4) { throw "Expected 4 UI snapshots, got $($shots.Count)" }
          foreach ($shot in $shots) {
            if ($shot.Length -lt 10000) { throw "UI snapshot appears empty: $($shot.Name) bytes=$($shot.Length)" }
          }
          & "artifacts\LongCapture\LongCapture.exe" --browser-agent-poc-self-test
          if ($LASTEXITCODE -ne 0) { throw "Browser Agent self-test failed exit=$LASTEXITCODE" }
          & "artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd" --ci
          if ($LASTEXITCODE -ne 0) { throw "RC6 QUICK failed exit=$LASTEXITCODE" }

      - name: Package, clean-extract, re-audit and retest final product
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force Output | Out-Null
          Copy-Item "artifacts\browser-agent-v016-quality-score.json" "Output\browser-agent-v016-quality-score.json" -Force
          Copy-Item "artifacts\browser-agent-v017-ui-quality-score.json" "Output\browser-agent-v017-ui-quality-score.json" -Force
          Copy-Item "artifacts\UiAudit-v017" "Output\UiAudit-v017" -Recurse -Force

          $zip = "Output\LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64.sha256.txt" "$hash  LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64.zip"

          $temp = Join-Path $env:RUNNER_TEMP "longcapture-browser-agent-v017-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $temp -Force

          $reAudit = Join-Path $env:RUNNER_TEMP "longcapture-browser-agent-v017-final-ui-audit"
          Remove-Item $reAudit -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Join-Path $temp "LongCapture.exe") -ArgumentList "--modern-ui-v017-audit=$reAudit" -WorkingDirectory $temp -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extracted v0.1.7 UI audit failed with exit code $($process.ExitCode)" }
          if (@(Get-ChildItem $reAudit -Filter "LongCapture-v017-ui-*.png").Count -ne 4) { throw "Extracted package did not produce four UI snapshots" }

          $process = Start-Process -FilePath (Join-Path $temp "LongCapture.exe") -ArgumentList "--browser-agent-poc-self-test" -WorkingDirectory $temp -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extracted v0.1.7 Browser self-test failed with exit code $($process.ExitCode)" }

      - name: Upload v0.1.7 package, scores and visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64
          path: |
            Output\LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64.zip
            Output\LongCapture-Browser-Agent-v0.1.7-Modern-Responsive-UI-x64.sha256.txt
            Output\browser-agent-v016-quality-score.json
            Output\browser-agent-v017-ui-quality-score.json
            Output\UiAudit-v017\ui-audit.json
            Output\UiAudit-v017\LongCapture-v017-ui-*.png
          if-no-files-found: error
