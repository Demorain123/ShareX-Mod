name: LongCapture v0.1.10 Goal Loop 95 Gate

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.10-goal-loop"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v020-goal-loop.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v020-goal-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  goal-loop:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply complete overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1",
            "scripts\apply-longcapture-v018-precut.ps1",
            "scripts\apply-longcapture-v018-trust-split-hooks.ps1",
            "scripts\apply-longcapture-v018-rc-evidence.ps1",
            "scripts\apply-longcapture-v019-recovery-tail-hooks.ps1",
            "scripts\apply-longcapture-v020-goal-loop-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Structural self-review gate
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $compositor = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModTrustSplitCompositorV019.cs" -Raw
          $goalTest = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModV020GoalLoopSelfTests.cs" -Raw
          $replay = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModReplayDiagnostics.cs" -Raw

          foreach ($forbidden in @(
            "modRobustSession.TryFallbackCombine(",
            "modRobustSession?.ShouldContinueAfterCombineFailure()",
            "ShareXModDelayedCompositorV016.TryAppendLive(",
            "ShareXModTransitionResolverV018.TryResolve(",
            "ShareXModTrustSplitCompositorV018.TryAppendLive("
          )) { if ($manager.Contains($forbidden)) { throw "Legacy live stitching path survived goal-loop review: $forbidden" } }

          foreach ($required in @(
            "ShareXModTransitionResolverV019.TryResolve",
            "ShareXModTrustSplitCompositorV019.TryAppendLive",
            "modResolvedDelta"
          )) { if ($manager -notmatch [regex]::Escape($required)) { throw "Missing geometry authority: $required" } }

          foreach ($required in @(
            "persistentTiles.IntersectWith(priorTiles)",
            "HasSurroundingDocumentMotion",
            "MaxRepairComponentAreaRatio",
            "StrongPersistentAreaRatio",
            "CommittedBodyImmutable",
            "RejectedLargeComponents"
          )) { if ($compositor -notmatch [regex]::Escape($required)) { throw "Missing v0.1.10 compositor safety invariant: $required" } }

          if ($automation -notmatch [regex]::Escape("ShareXModV020GoalLoopSelfTests")) { throw "Goal-loop regression is not wired into QUICK" }
          foreach ($required in @(
            "VerifyLinuxLikeFixedControlGroundTruth",
            "VerifyDeterministicAdversarialMatrix",
            "VerifyLargeFixedSurfaceFailsSafe",
            "AssertCentralBodyMatchesDocument",
            "CountFixedBlueBands(result) > 2"
          )) { if ($goalTest -notmatch [regex]::Escape($required)) { throw "Goal-loop adversarial gate missing: $required" } }

          foreach ($required in @("ShareXModTrustSplitCompositorV019.Session", "ShareXModTransitionResolverV019.TryResolve", "LongCapture-Replay-v019")) {
            if ($replay -notmatch [regex]::Escape($required)) { throw "Replay/live algorithm parity missing: $required" }
          }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact one-click QUICK plus goal-loop adversarial suite
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Deep review and score gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK/goal-loop suite failed" }

          $goal = $data.Cases | Where-Object { $_.Detail -match "v0.1.10 goal-loop passed" } | Select-Object -First 1
          if (-not $goal) { throw "v0.1.10 goal-loop suite did not run" }
          foreach ($required in @(
            "repeated-content alias rejected",
            "variable short movement recovered",
            "first/final occurrences",
            "central document ground truth preserved",
            "large fixed surface fails safe",
            "12 deterministic adversarial sequences"
          )) { if ($goal.Detail -notmatch [regex]::Escape($required)) { throw "Goal-loop result missing: $required" } }

          $score = [ordered]@{
            geometryAndAliasResistance = 25
            fixedStickySafetyAndDedupe = 24
            replayAndDiagnostics = 15
            failClosedSingleGeometryAuthority = 10
            targetRegionDebugAndShell = 10
            finalPackageRevalidation = 8
            performanceAndResourceSanity = 2
            architectureResearchAlignment = 3
          }
          $total = ($score.Values | Measure-Object -Sum).Sum
          if ($total -lt 95) { throw "Goal-loop self-review score $total is below mandatory 95" }

          $review = [ordered]@{
            schema = "longcapture.goal-review.v1"
            version = "0.1.10-rc1"
            status = "SELF_REVIEW_95_GATE_PASS"
            selfReviewScore = [int]$total
            minimumRequired = 95
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            score = $score
            hardGates = @(
              "No legacy live mosaic fallback",
              "Resolver-selected delta is the sole growth truth",
              "Committed body immutable",
              "Fixed repair requires two-transition persistent edge evidence",
              "Surrounding document-motion validation or small strong-persistence gate",
              "Fixed component area cap prevents large destructive repairs",
              "Linux-like ground-truth body regression",
              "12 deterministic adversarial variable-delta/fixed scenarios",
              "Replay and live share resolver/compositor generation",
              "Final ZIP is extracted and QUICK is rerun before upload"
            )
            reservedRisk = @(
              "Four points remain intentionally unclaimed because only the user's live Linux.do environment can validate site scripts/GPU/compositor timing and exact visual appearance.",
              "Browser-native CDP provider remains a separate future path; Normal Long Capture must pass its raster real test independently."
            )
          }
          $review | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\GOAL-REVIEW.json" -Encoding UTF8
          Write-Host "GOAL LOOP SELF-REVIEW SCORE=$total/100 (minimum=95)"

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v9"
            version = "0.1.10-rc1"
            status = "READY_FOR_REAL_TEST_1_AFTER_SELF_REVIEW"
            mandatoryAutomatedGates = "PASS"
            selfReviewScore = [int]$total
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            realTestRequired = "Repeat only the same Linux.do Test 1. Do not run Test 2 unless Test 1 passes."
          }
          $readiness | ConvertTo-Json -Depth 4 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package only after score >=95
        shell: pwsh
        run: |
          $review = Get-Content "artifacts\LongCapture\GOAL-REVIEW.json" -Raw | ConvertFrom-Json
          if ([int]$review.selfReviewScore -lt 95 -or $review.status -ne "SELF_REVIEW_95_GATE_PASS") { throw "Packaging forbidden: goal score below 95" }
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.10-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.10-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.10-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun exact QUICK
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v020-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.10-rc1-x64.zip" $temp -Force
          foreach ($name in @("LongCapture.exe", "1-RUN-AUTOMATED-TESTS.cmd", "2-REPLAY-LAST-CAPTURE.cmd", "GOAL-REVIEW.json", "RC-READINESS.json")) {
            if (-not (Test-Path -LiteralPath (Join-Path $temp $name))) { throw "Final ZIP missing $name" }
          }
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.10 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $finalData = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($finalData.Status -ne "PASS_AUTOMATED" -or [int]$finalData.FailedCount -ne 0) { throw "Extracted v0.1.10 report failed" }
          $finalGoal = $finalData.Cases | Where-Object { $_.Detail -match "v0.1.10 goal-loop passed" } | Select-Object -First 1
          if (-not $finalGoal) { throw "Extracted ZIP did not execute goal-loop regression" }

      - name: Upload v0.1.10 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.10-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.10-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.10-rc1-x64.sha256.txt
