name: Disable legacy ShareX-Mod auto workflows once

on:
  push:
    branches:
      - "mod/robust-scrolling-v0.1"
    paths:
      - ".github/workflows/disable-legacy-auto-workflows-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mod/robust-scrolling-v0.1
          fetch-depth: 0

      - name: Convert legacy one-shot and version validators to manual dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patterns = @(
            ".github/workflows/apply-v*.yml",
            ".github/workflows/diagnose-v*.yml",
            ".github/workflows/validate-mod-v*.yml"
          )

          $files = @()
          foreach ($pattern in $patterns) {
            $files += Get-ChildItem $pattern -File -ErrorAction SilentlyContinue
          }
          $files = $files | Sort-Object FullName -Unique

          foreach ($file in $files) {
            $text = [IO.File]::ReadAllText($file.FullName)
            if ($text -notmatch '(?m)^on:\s*$') { continue }

            $updated = [regex]::Replace(
              $text,
              '(?ms)^on:\s*\r?\n.*?(?=^permissions:|^jobs:)',
              "on:`n  workflow_dispatch:`n`n",
              1)

            if ($updated -ne $text) {
              [IO.File]::WriteAllText($file.FullName, $updated, [Text.UTF8Encoding]::new($false))
              Write-Host "manual-only: $($file.Name)"
            }
          }

          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sharex-mod-ci"
          git config user.email "sharex-mod-ci@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: make legacy ShareX-Mod workflows manual-only"
          git push origin HEAD:mod/robust-scrolling-v0.1
