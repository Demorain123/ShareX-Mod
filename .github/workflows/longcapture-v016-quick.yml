name: LongCapture v0.1.6 Replay Compositor Quick

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.6-replay-compositor"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v016-quick.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v016-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify v0.1.6 markers
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $main = Get-Content "LongCapture.Standalone\MainForm.cs" -Raw
          $program = Get-Content "LongCapture.Standalone\Program.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $exclusion = Get-Content "LongCapture.Standalone\CaptureExclusion.cs" -Raw
          $compositor = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModDelayedCompositorV016.cs" -Raw
          $replay = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModReplayDiagnostics.cs" -Raw

          foreach ($required in @(
            "ShareXModDelayedCompositorV016.TryAppendLive",
            "ShareXModReplayDiagnostics.RecordRawFrame",
            "ShareXModReplayDiagnostics.RecordAnchor"
          )) {
            if ($manager -notmatch [regex]::Escape($required)) { throw "Missing v0.1.6 manager marker: $required" }
          }
          foreach ($forbidden in @(
            "ShareXModStaticOverlayCleaner.TryRepairPreviousResultTail",
            "ShareXModStaticOverlayCleaner.TryClean(",
            "ShareXModAnchorCompositorV014.TryAppend(Result"
          )) {
            if ($manager -match [regex]::Escape($forbidden)) { throw "Old mosaic/pre-clean repair path still active: $forbidden" }
          }
          foreach ($required in @(
            "Debug: GUI + raw replay evidence",
            "Debug: include internal helper/selector/Avalonia windows",
            "RawFrameReplayEvidence = ShareXModReplayDiagnostics.Enabled"
          )) {
            if ($main -notmatch [regex]::Escape($required)) { throw "Missing v0.1.6 GUI marker: $required" }
          }
          foreach ($required in @(
            "includeInternalDebugWindows",
            "windowRole == CaptureWindowRole.DebugVisible || includeInternalDebugWindows"
          )) {
            if ($exclusion -notmatch [regex]::Escape($required)) { throw "Missing role-aware exclusion marker: $required" }
          }
          foreach ($required in @("raw-frames-v016", "ShareXModOfflineReplay", "frame-{index:D4}.bmp")) {
            if ($replay -notmatch [regex]::Escape($required)) { throw "Missing replay evidence marker: $required" }
          }
          foreach ($required in @("currentRaw", "previousRaw", "PendingTailComponents", "currentRaw,", "sourceY = repair.Y - scrollDelta")) {
            if ($compositor -notmatch [regex]::Escape($required)) { throw "Missing delayed compositor marker: $required" }
          }
          if ($automation -notmatch [regex]::Escape("ShareXModV016ReplaySelfTests")) { throw "v0.1.6 replay fixture is not in QUICK" }
          if ($program -notmatch [regex]::Escape("ShareXModOfflineReplay.Replay(replayDirectory)")) { throw "--replay CLI path missing" }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact Quick acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Validate replay fixture and readiness
        shell: pwsh
        run: |
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK failed" }
          $fixture = $data.Cases | Where-Object { $_.Detail -match "v0.1.6 raw-frame delayed compositor/replay passed" } | Select-Object -First 1
          if (-not $fixture) { throw "v0.1.6 raw-frame replay fixture did not run" }
          if ($fixture.Detail -notmatch "liveFixedBands=1|liveFixedBands=0") { throw "Live delayed compositor still repeated the fixed control" }
          if ($fixture.Detail -notmatch "replayFixedBands=1|replayFixedBands=0") { throw "Offline replay still repeated the fixed control" }
          Remove-Item "artifacts\LongCapture\AutomationReports" -Recurse -Force

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v5"
            version = "0.1.6-rc1"
            status = "READY_FOR_REAL_TEST_1"
            mandatoryGates = "PASS"
            automatedScore = 94
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            fixedFromRealTest = @(
              "normal Debug captures only intentional LongCapture GUI/HUD windows",
              "internal helper/selector/Avalonia windows remain excluded unless user explicitly opts in",
              "each Debug capture stores lossless raw viewport frames and anchor deltas",
              "fixed/sticky classification now uses neighbouring raw frames instead of the already-composited mosaic",
              "delayed repair writes current(y-delta) document pixels onto a fresh output surface",
              "disk-backed offline replay reproduces the compositor without repeating the website capture",
              "moving body-content false-positive guard is part of QUICK"
            )
            realTestRequired = @(
              "Repeat Linux.do Test 1 once with Debug enabled and internal-window option OFF",
              "If pixels are still wrong, export diagnostics; raw frames can now be replayed offline without another live capture"
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package v0.1.6 RC1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.6-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.6-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.6-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun Quick
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v016-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.6-rc1-x64.zip" $temp -Force
          if (-not (Test-Path "$temp\2-REPLAY-LAST-CAPTURE.cmd")) { throw "Replay launcher missing from final ZIP" }
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.6 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $data = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "Extracted v0.1.6 report failed" }

      - name: Upload v0.1.6 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.6-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.6-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.6-rc1-x64.sha256.txt
