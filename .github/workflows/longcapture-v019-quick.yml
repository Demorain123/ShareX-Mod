name: LongCapture v0.1.9 Recovery Tail Quick

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.9-recovery-tail"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v019-quick.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v019-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1",
            "scripts\apply-longcapture-v018-precut.ps1",
            "scripts\apply-longcapture-v018-trust-split-hooks.ps1",
            "scripts\apply-longcapture-v018-rc-evidence.ps1",
            "scripts\apply-longcapture-v019-recovery-tail-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify v0.1.9 structural invariants
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $replay = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModReplayDiagnostics.cs" -Raw
          $quality = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModFinalQualitySummary.cs" -Raw
          $helper = Get-Content "LongCapture.Standalone\Replay-Last-Capture.ps1" -Raw

          foreach ($required in @(
            "ShareXModTransitionResolverV019.TryResolve",
            "ShareXModTrustSplitCompositorV019.TryAppendLive",
            "modResolvedDelta",
            "bool modV019HoldReliableReference = false",
            "else if (!modV019HoldReliableReference)"
          )) { if ($manager -notmatch [regex]::Escape($required)) { throw "Missing v0.1.9 manager invariant: $required" } }

          foreach ($forbidden in @(
            "modRobustSession.TryFallbackCombine(",
            "modRobustSession?.ShouldContinueAfterCombineFailure()",
            "ShareXModDelayedCompositorV016.TryAppendLive(",
            "ShareXModTransitionResolverV018.TryResolve(",
            "ShareXModTrustSplitCompositorV018.TryAppendLive("
          )) { if ($manager.Contains($forbidden)) { throw "Forbidden legacy live path remains: $forbidden" } }

          if ($automation -notmatch [regex]::Escape("ShareXModV019RecoveryTailSelfTests")) { throw "v0.1.9 recovery-tail regression missing from QUICK" }
          foreach ($required in @("ShareXModTrustSplitCompositorV019.Session", "ShareXModTransitionResolverV019.TryResolve", "LongCapture-Replay-v019", 'version = "0.1.9"', "hasSavedResolution")) {
            if ($replay -notmatch [regex]::Escape($required)) { throw "v0.1.9 replay gate missing: $required" }
          }
          foreach ($required in @("transitionV019", "trustSplitV019", "ProvisionalTailRepairEnabled", "TailRepairComponents")) {
            if ($quality -notmatch [regex]::Escape($required)) { throw "v0.1.9 quality gate missing: $required" }
          }
          foreach ($required in @("-LiteralPath", "LongCapture\CaptureSessions", "DiscoverOnly")) {
            if ($helper -notmatch [regex]::Escape($required)) { throw "Replay helper missing literal-path hardening: $required" }
          }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact Quick acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Validate v0.1.9 regression and replay path hardening
        shell: pwsh
        run: |
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK failed" }
          $fixture = $data.Cases | Where-Object { $_.Detail -match "v0.1.9 recovery-tail passed" } | Select-Object -First 1
          if (-not $fixture) { throw "v0.1.9 recovery-tail fixture did not run" }
          foreach ($required in @(
            "outlier direct anchor gated",
            "variable short movement full-range recovered",
            "committed body immutable",
            "provisional fixed/sticky tail repair exercised",
            "legacy mosaic fallback forbidden"
          )) { if ($fixture.Detail -notmatch [regex]::Escape($required)) { throw "v0.1.9 fixture missing assertion: $required" } }

          # Regression for the user's real replay failure: legal sibling names containing [] must
          # never be interpreted as wildcard syntax, and discovery must include the package/session roots.
          $bracketSibling = Join-Path (Split-Path (Resolve-Path "artifacts\LongCapture") -Parent) "[Backup_TS_mainly]Chrome-134.0.6998.178"
          [IO.Directory]::CreateDirectory($bracketSibling) | Out-Null
          $fixtureSession = Join-Path "artifacts\LongCapture" "ShareX-Mod\CaptureSessions\ci-replay-fixture"
          [IO.Directory]::CreateDirectory((Join-Path $fixtureSession "raw-frames-v016")) | Out-Null
          & "artifacts\LongCapture\Replay-Last-Capture.ps1" -DiscoverOnly
          if ($LASTEXITCODE -ne 0) { throw "Replay discovery failed with bracketed sibling directory present" }
          Remove-Item -LiteralPath $bracketSibling -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path "artifacts\LongCapture" "ShareX-Mod") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "artifacts\LongCapture\AutomationReports" -Recurse -Force

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v8"
            version = "0.1.9-rc1"
            status = "READY_FOR_REAL_TEST_1"
            mandatoryAutomatedGates = "PASS"
            automatedScore = 86
            scoreCapReason = "The evidence-derived v0.1.9 regressions pass, but the real Linux.do Test 1 has not yet passed; score remains capped below 90."
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            evidenceDerivedFixes = @(
              "low-consensus direct-anchor outliers no longer bypass the temporal/raw-pixel geometry gate",
              "stable prior miss can recover a legitimate variable short wheel movement via full-range raw validation",
              "committed mosaic remains immutable while only the immediately previous appended tail is provisional for conservative fixed/sticky repair",
              "replay helper uses known roots plus LiteralPath and includes LocalAppData LongCapture sessions",
              "offline replay revalidates recorded v0.1.7/v0.1.8 deltas instead of blindly accepting them"
            )
            realTestRequired = @(
              "Repeat the same Linux.do Test 1 once with Scroll amount 5; do not run Test 2 unless Test 1 passes",
              "If it still fails, export diagnostics; v0.1.9 records geometry-v019 and trust-split-v019 evidence automatically"
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package v0.1.9 RC1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.9-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.9-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.9-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun Quick
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v019-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.9-rc1-x64.zip" $temp -Force
          if (-not (Test-Path -LiteralPath (Join-Path $temp "Replay-Last-Capture.ps1"))) { throw "Replay helper missing from final ZIP" }
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.9 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $finalData = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($finalData.Status -ne "PASS_AUTOMATED" -or [int]$finalData.FailedCount -ne 0) { throw "Extracted v0.1.9 report failed" }

          $bracketSibling = Join-Path (Split-Path $temp -Parent) "[Backup_TS_mainly]Chrome-134.0.6998.178"
          [IO.Directory]::CreateDirectory($bracketSibling) | Out-Null
          $fixtureSession = Join-Path $temp "ShareX-Mod\CaptureSessions\ci-replay-fixture"
          [IO.Directory]::CreateDirectory((Join-Path $fixtureSession "raw-frames-v016")) | Out-Null
          & (Join-Path $temp "Replay-Last-Capture.ps1") -DiscoverOnly
          if ($LASTEXITCODE -ne 0) { throw "Extracted replay helper failed bracket-path regression" }
          Remove-Item -LiteralPath $bracketSibling -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload v0.1.9 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.9-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.9-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.9-rc1-x64.sha256.txt
