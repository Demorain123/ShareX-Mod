name: LongCapture v0.1.7 Anchor Continuity Quick

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.7-anchor-continuity"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v017-quick.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v017-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify v0.1.7 structural gates
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $recorder = Get-Content "LongCapture.Standalone\CaptureSessionRecorder.cs" -Raw
          $replay = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModReplayDiagnostics.cs" -Raw
          foreach ($required in @(
            "ShareXModAnchorContinuityV017.TryResolve",
            "ShareXModReplayDiagnostics.RecordResolution",
            "ShareXModDelayedCompositorV016.TryAppendLive"
          )) { if ($manager -notmatch [regex]::Escape($required)) { throw "Missing manager gate: $required" } }
          if ($manager -match [regex]::Escape("newResult = await CombineImagesAsync(Result, lastScreenshot)")) {
            throw "v0.1.7 must not fall from an unresolved transition into legacy CombineImagesAsync"
          }
          if ($automation -notmatch [regex]::Escape("ShareXModV017AnchorContinuitySelfTests")) { throw "forced anchor-failure regression missing from QUICK" }
          foreach ($required in @("rawReplayFramesConvertedToPng", "ImageFormat.Png", "512L * 1024L * 1024L")) {
            if ($recorder -notmatch [regex]::Escape($required)) { throw "raw diagnostics export gate missing: $required" }
          }
          foreach ($required in @("resolutions-v017.jsonl", "frame-*.*", "LongCapture-Replay-v017")) {
            if ($replay -notmatch [regex]::Escape($required)) { throw "replay continuity gate missing: $required" }
          }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact Quick acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Validate v0.1.7 regression and readiness
        shell: pwsh
        run: |
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK failed" }
          $fixture = $data.Cases | Where-Object { $_.Detail -match "v0.1.7 anchor-continuity passed" } | Select-Object -First 1
          if (-not $fixture) { throw "v0.1.7 forced-anchor-failure fixture did not run" }
          if ($fixture.Detail -notmatch "forcedDirectFailures=4") { throw "forced failures were not exercised" }
          if ($fixture.Detail -notmatch "unresolved=0") { throw "fixture left unresolved transitions" }
          if ($fixture.Detail -notmatch "liveFixedBands=1|liveFixedBands=0") { throw "live fixed controls repeated" }
          if ($fixture.Detail -notmatch "replayFixedBands=1|replayFixedBands=0") { throw "diagnostic PNG replay fixed controls repeated" }
          Remove-Item "artifacts\LongCapture\AutomationReports" -Recurse -Force

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v6"
            version = "0.1.7-rc1"
            status = "READY_FOR_REAL_TEST_1"
            mandatoryGates = "PASS"
            automatedScore = 95
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            fixedFromRealV016Evidence = @(
              "strict-anchor rejection no longer bypasses delayed fixed-overlay compositor",
              "vertical fallback and temporal-prior deltas must be validated against the raw frame pair",
              "unresolved transitions stop as partial instead of invoking legacy mosaic matcher",
              "diagnostics convert and include complete raw BMP replay frames as PNG",
              "offline replay accepts exported PNG raw frames",
              "forced direct-anchor failures are part of QUICK"
            )
            realTestRequired = @(
              "Repeat Linux.do Test 1 once; do not run Test 2 unless Test 1 passes",
              "If it still fails, the new diagnostics ZIP must contain replayable raw frame PNGs so further compositor iterations do not require another website capture"
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package v0.1.7 RC1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.7-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.7-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.7-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun Quick
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v017-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.7-rc1-x64.zip" $temp -Force
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.7 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $data = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "Extracted v0.1.7 report failed" }

      - name: Upload v0.1.7 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.7-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.7-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.7-rc1-x64.sha256.txt
