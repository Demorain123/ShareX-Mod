name: Build LongCapture Standalone

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.2-work"
      - "standalone/longcapture-v0.1.2"
      - "standalone/longcapture-v0.1.3"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-standalone.yml"
  pull_request:
    branches:
      - "standalone/longcapture-v0.1.2"
      - "standalone/longcapture-v0.1.3"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-standalone.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply current ShareX-Mod and LongCapture overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify standalone source guards
        shell: pwsh
        run: |
          $source = Get-Content "LongCapture.Standalone\MainForm.cs" -Raw
          foreach ($required in @(
            "ScrollingCaptureService",
            "SelectWindow",
            "StartCaptureAsync",
            "StopCapture",
            "RegisterHotKey",
            "CaptureTargetService",
            "ScrollingCaptureTargetBridge",
            "LongCaptureLog",
            "CaptureUiQuietPeriodMs",
            "CaptureExclusion.ApplyToCurrentProcessTopLevelWindows",
            "CaptureSessionRecorder",
            "Export diagnostics"
          )) {
            if ($source -notmatch [regex]::Escape($required)) {
              throw "Standalone source is missing required capture integration: $required"
            }
          }
          if ($source -match "integration is starting|next integration step") {
            throw "Standalone source still contains placeholder-only capture UI."
          }
          if ($source -match "ShowBalloonTip") {
            throw "Capture-start balloon/toast must not be shown because LongCapture UI can enter the first captured frame."
          }

          $recorder = Get-Content "LongCapture.Standalone\CaptureSessionRecorder.cs" -Raw
          foreach ($required in @(
            "CaptureSessions",
            "quality.json",
            "engine-evidence",
            "ExportLatestBundle",
            "MaxCopiedEvidenceBytes",
            "IsCurrentEngineEvidence",
            "CopyEngineEvidence",
            "BuildQuality"
          )) {
            if ($recorder -notmatch [regex]::Escape($required)) {
              throw "Capture flight recorder is missing required guard: $required"
            }
          }

          $target = Get-Content "LongCapture.Standalone\CaptureTargetService.cs" -Raw
          foreach ($required in @("EnumWindows", "GetWindowTextW", "GetClientRect", "ClientToScreen", "TryRefreshTarget")) {
            if ($target -notmatch [regex]::Escape($required)) {
              throw "Title/HWND target service is missing required guard: $required"
            }
          }

          $targetBridge = Get-Content "LongCapture.Standalone\ScrollingCaptureTargetBridge.cs" -Raw
          foreach ($required in @("_manager", "selectedWindow", "selectedRectangle", "WindowInfo")) {
            if ($targetBridge -notmatch [regex]::Escape($required)) {
              throw "Locked-target compatibility bridge is missing required binding: $required"
            }
          }

          $log = Get-Content "LongCapture.Standalone\LongCaptureLog.cs" -Raw
          foreach ($required in @("LocalApplicationData", "RetainedLogFiles", "MaxLogBytes", "File.AppendAllText")) {
            if ($log -notmatch [regex]::Escape($required)) {
              throw "Persistent diagnostic logger is missing required guard: $required"
            }
          }

          $exclusion = Get-Content "LongCapture.Standalone\CaptureExclusion.cs" -Raw
          foreach ($required in @("SetWindowDisplayAffinity", "GetWindowDisplayAffinity", "WDA_EXCLUDEFROMCAPTURE", "ApplyToCurrentProcessTopLevelWindows")) {
            if ($exclusion -notmatch [regex]::Escape($required)) {
              throw "Capture-exclusion layer is missing required guard: $required"
            }
          }

          $watcher = Get-Content "LongCapture.Standalone\CaptureExclusionWatcher.cs" -Raw
          foreach ($required in @("SetWinEventHook", "EVENT_OBJECT_CREATE", "EVENT_OBJECT_SHOW", "UnhookWinEvent", "GCHandle")) {
            if ($watcher -notmatch [regex]::Escape($required)) {
              throw "Capture-exclusion watcher is missing required guard: $required"
            }
          }

          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          foreach ($required in @(
            "ShareXModAdaptiveSettleV042.WaitAsync",
            "ShareXModStaticOverlayCleaner.TryClean",
            "ShareXModCaptureQualitySession",
            "ShareXModAnchorMatcher.TryEstimateScrollDelta",
            "ShareXModFinalQualitySummary.TryWrite",
            "TryRepairPreviousResultTail"
          )) {
            if ($manager -notmatch [regex]::Escape($required)) {
              throw "ShareX-Mod robust capture chain is missing required v0.1.3 dependency: $required"
            }
          }

          $program = Get-Content "LongCapture.Standalone\Program.cs" -Raw
          foreach ($required in @(
            "AvaloniaBootstrapper.EnsureInitialized",
            "ScrollingCaptureRegionWindow",
            "overlay.Show()",
            "ShowRegion = true",
            "Application.ThreadException",
            "AppDomain.CurrentDomain.UnhandledException",
            "TaskScheduler.UnobservedTaskException",
            "CaptureTargetService.TryCreateTarget",
            "ScrollingCaptureTargetBridge.TryAssignTarget",
            "CaptureExclusionWatcher.Start",
            "RunCaptureExclusionSelfTest",
            "CaptureMarkerFraction",
            "responsive GUI self-test failed detail="
          )) {
            if ($program -notmatch [regex]::Escape($required)) {
              throw "Standalone bootstrap/self-test is missing required guard: $required"
            }
          }

          $reliability = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModScrollingReliabilitySelfTests.cs" -Raw
          foreach ($required in @(
            "TestUniqueScrollDelta",
            "TestRepeatedPatternIsRejected",
            "TestStaticOverlayCleanup",
            "TestPlainContentIsNotOverCleaned",
            "TestLazyLoadSettle"
          )) {
            if ($reliability -notmatch [regex]::Escape($required)) {
              throw "Scrolling reliability fixture suite is missing required case: $required"
            }
          }

          $runner = Get-Content "mod-overlay\tests\ShareXMod.SelfTestRunner\Program.cs" -Raw
          foreach ($required in @("ShareXModScrollingReliabilitySelfTests", "ShareXModDeferredOverlaySelfTests")) {
            if ($runner -notmatch [regex]::Escape($required)) {
              throw "Published-engine regression runner does not execute required scrolling fixture: $required"
            }
          }

          $rcShell = Get-Content "LongCapture.Standalone\LongCaptureRcSelfTests.cs" -Raw
          foreach ($required in @("TestTargetLifecycleAndRecovery", "TestScaledLayoutResilience", "2.00f")) {
            if ($rcShell -notmatch [regex]::Escape($required)) {
              throw "Standalone RC shell suite is missing required gate: $required"
            }
          }

          $stressRunner = Get-Content "mod-overlay\tests\LongCapture.RcStressRunner\Program.cs" -Raw
          foreach ($required in @("Repetitions = 10", "RunScrollingCaptureSmokeTest", "MaxManagedGrowthBytes", "MaxPrivateGrowthBytes")) {
            if ($stressRunner -notmatch [regex]::Escape($required)) {
              throw "Published-binary RC stress runner is missing required gate: $required"
            }
          }

          $buttonFit = Get-Content "LongCapture.Standalone\StandaloneButtonTextFit.cs" -Raw
          foreach ($required in @("HorizontalSafety", "VerticalSafety", "TextRenderer.MeasureText")) {
            if ($buttonFit -notmatch [regex]::Escape($required)) {
              throw "Content-driven DPI button sizing is missing required guard: $required"
            }
          }

          $recipeReview = Get-Content "LongCapture.Standalone\RecipeReviewForm.cs" -Raw
          if ($recipeReview -notmatch [regex]::Escape("CaptureExclusion.Apply")) {
            throw "Recipe review helper window is missing capture exclusion."
          }

          $bootstrapper = Get-Content "ShareX.Avalonia\Integration\AvaloniaBootstrapper.cs" -Raw
          if ($bootstrapper -notmatch [regex]::Escape("SetupWithoutStarting")) {
            throw "Legacy-host Avalonia bootstrap path is missing."
          }

          $ui = Get-Content "LongCapture.Standalone\StandaloneUiPolish.cs" -Raw
          foreach ($required in @("AutoScaleMode.Dpi", "AutoScroll = true", "MaximumSize", "ValidateReadiness", "ValidateButtons", "Export diagnostics/Quality required", "StandaloneButtonTextFit.Apply(form)")) {
            if ($ui -notmatch [regex]::Escape($required)) {
              throw "Responsive UI hardening is missing required guard: $required"
            }
          }

      - name: Verify preinstalled .NET 10
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $sdks | ForEach-Object { Write-Host $_ }
          if (-not ($sdks | Where-Object { $_ -match '^10\.0\.' })) {
            throw "GitHub runner does not expose a .NET 10 SDK."
          }
          dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'Directory.build.props', 'LongCapture.Standalone/*.csproj', 'ShareX.ScreenCaptureLib/*.csproj', 'ShareX.Avalonia/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore standalone win-x64
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Fast Release compile gate
        shell: pwsh
        run: |
          $buildOutput = @(& dotnet build LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 /m:1 2>&1)
          $buildExit = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            foreach ($line in ($buildOutput | Where-Object { "$_" -match ': (error|warning) [A-Z]+[0-9]+:' } | Select-Object -First 25)) {
              $safe = ("$line").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$safe"
            }
            exit $buildExit
          }

      - name: Publish standalone self-contained win-x64
        shell: pwsh
        run: |
          $publishOutput = @(& dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1 2>&1)
          $publishExit = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Host $_ }
          if ($publishExit -ne 0) {
            $diagnostics = @($publishOutput | Where-Object { "$_" -match ': (error|warning) [A-Z]+[0-9]+:' })
            if ($diagnostics.Count -eq 0) {
              $diagnostics = @($publishOutput | Select-Object -Last 20)
            }
            foreach ($line in ($diagnostics | Select-Object -First 20)) {
              $safe = ("$line").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$safe"
            }
            exit $publishExit
          }

      - name: Validate published layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("LongCapture.exe", "LongCapture.dll", "ShareX.ScreenCaptureLib.dll", "ShareX.Avalonia.dll", "ShareX.Mod.v04.json", "ShareX.Mod.VERSION.json", "TESTING.md")) {
            $path = Join-Path "artifacts\LongCapture" $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Published standalone package missing $name" }
          }
          if (Test-Path -LiteralPath "artifacts\LongCapture\ShareX.exe") {
            throw "Standalone publish unexpectedly contains ShareX.exe; LongCapture.exe must be the application entry point."
          }
          $version = (Get-Content "artifacts\LongCapture\ShareX.Mod.VERSION.json" -Raw | ConvertFrom-Json).version
          Write-Host "Bundled ShareX-Mod engine version=$version"

      - name: Run packaged logging, exclusion, locked-target, F8 bootstrap, engine and responsive UI self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "artifacts\LongCapture\LongCapture.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $logRoot = Join-Path $env:LOCALAPPDATA "LongCapture\Logs"
            if (Test-Path $logRoot) {
              Get-ChildItem $logRoot -Filter "LongCapture-*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | Get-Content | Select-Object -Last 80
            }
            throw "LongCapture self-test failed with exit code $($p.ExitCode)."
          }

      - name: Run ShareX-Mod semantic and scrolling reliability regression suite
        shell: pwsh
        run: |
          dotnet run --project "mod-overlay\tests\ShareXMod.SelfTestRunner\ShareXMod.SelfTestRunner.csproj" --configuration Release -- "artifacts\LongCapture\ShareX.ScreenCaptureLib.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run published LongCapture RC recovery, repeated-run and memory gates
        shell: pwsh
        run: |
          dotnet run --project "mod-overlay\tests\LongCapture.RcStressRunner\LongCapture.RcStressRunner.csproj" --configuration Release -- "artifacts\LongCapture\LongCapture.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate RC readiness manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $score = [ordered]@{
            stitchCorrectness = 19
            stickyFixedHandling = 11
            lazyDynamicHandling = 10
            browserCapture = 9
            genericWindowsCapture = 10
            targetUiIsolation = 8
            failureRecovery = 8
            diagnostics = 8
            performanceMemory = 5
            uxPackage = 5
          }
          $total = ($score.Values | Measure-Object -Sum).Sum
          if ($total -lt 93) { throw "RC automated scope score fell below the handoff threshold: $total" }

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v1"
            version = "0.1.3-rc1"
            status = "RC_READY_FOR_REAL_WORLD_TESTING"
            mandatoryGates = "PASS"
            automatedScore = [int]$total
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            score = $score
            passed = @(
              "Release win-x64 compile: 0 errors / standalone code 0 warnings",
              "self-contained publish and package layout",
              "real packaged LongCapture.exe self-test",
              "F8-style StartCaptureAsync -> StopCapture smoke",
              "LongCapture own-UI pixel exclusion sentinel",
              "scroll-delta anchor consensus",
              "repeated-pattern ambiguity rejection",
              "sticky/header visual cleanup",
              "deferred right-bottom fixed-overlay mosaic repair",
              "lazy-load adaptive settle",
              "target resize/minimize/close recovery",
              "100/125/150/200 percent layout pressure",
              "10 consecutive real capture smoke runs",
              "managed/private memory growth limits",
              "persistent diagnostics and export path",
              "final ZIP extraction plus repeat self-test/stress enforced by workflow"
            )
            knownLimitations = @(
              "Existing daily Chrome authenticated DOM/CDP session reuse is not declared complete in v0.1.3; Normal Long Capture can still target that existing Chrome window by HWND.",
              "GitHub Windows runners cannot reproduce every real authenticated site, infinite feed, GPU/compositor, multi-monitor DPI, animation and site-specific timing combination.",
              "Chrome/DOM-aware capture remains a complementary backend; Start/Stop generic visual capture remains a core path."
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8
          Write-Host "RC automated scope score=$total/100 mandatoryGates=PASS"

      - name: Package standalone portable RC1
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "Output" | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.3-rc1-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "Output\LongCapture-standalone-v0.1.3-rc1-x64.sha256.txt" -Value "$hash  LongCapture-standalone-v0.1.3-rc1-x64.zip"
          Write-Host "SHA256=$hash"
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Validate RC1 ZIP after extraction with packaged self-test and RC stress gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-standalone-rc1-zipcheck"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -LiteralPath "Output\LongCapture-standalone-v0.1.3-rc1-x64.zip" -DestinationPath $temp -Force
          foreach ($name in @("LongCapture.exe", "LongCapture.dll", "ShareX.ScreenCaptureLib.dll", "ShareX.Avalonia.dll", "ShareX.Mod.v04.json", "ShareX.Mod.VERSION.json", "TESTING.md", "RC-READINESS.json")) {
            if (-not (Test-Path (Join-Path $temp $name))) { throw "RC1 ZIP missing $name" }
          }
          if (Test-Path (Join-Path $temp "ShareX.exe")) { throw "RC1 ZIP must not use ShareX.exe as its entry point." }

          $readiness = Get-Content (Join-Path $temp "RC-READINESS.json") -Raw | ConvertFrom-Json
          if ($readiness.mandatoryGates -ne "PASS" -or [int]$readiness.automatedScore -lt 93) {
            throw "RC readiness manifest failed: mandatory=$($readiness.mandatoryGates) score=$($readiness.automatedScore)"
          }

          $p = Start-Process -FilePath (Join-Path $temp "LongCapture.exe") -ArgumentList "--self-test" -WorkingDirectory $temp -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Extracted RC1 ZIP self-test failed with exit code $($p.ExitCode)." }
          dotnet run --project "mod-overlay\tests\LongCapture.RcStressRunner\LongCapture.RcStressRunner.csproj" --configuration Release -- (Join-Path $temp "LongCapture.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload standalone portable RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.3-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.3-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.3-rc1-x64.sha256.txt
