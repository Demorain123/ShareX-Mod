name: LongCapture Browser Agent v0.1 PoC

on:
  push:
    branches:
      - "standalone/browser-agent-v0.1-poc"
    paths:
      - "LongCapture.Standalone/**"
      - ".github/workflows/browser-agent-v01-poc.yml"
  pull_request:
    branches:
      - "standalone/longcapture-v0.1.9-rc6-sparse-edge-evidence"
    paths:
      - "LongCapture.Standalone/**"
      - ".github/workflows/browser-agent-v01-poc.yml"
  workflow_dispatch:

concurrency:
  group: browser-agent-v01-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Browser Agent deterministic self-test
        shell: cmd
        run: artifacts\LongCapture\LongCapture.exe --browser-agent-poc-self-test

      - name: Existing QUICK acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Verify Browser Agent package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "artifacts\LongCapture\START-BROWSER-AGENT-POC.cmd",
            "artifacts\LongCapture\BrowserAgent\README.md",
            "artifacts\LongCapture\BrowserAgent\INSTALL-BROWSER-AGENT.cmd",
            "artifacts\LongCapture\BrowserAgent\Install-Browser-Agent.ps1",
            "artifacts\LongCapture\BrowserAgent\UNINSTALL-BROWSER-AGENT.cmd",
            "artifacts\LongCapture\BrowserAgent\Extension\manifest.json",
            "artifacts\LongCapture\BrowserAgent\Extension\service-worker.js"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing Browser Agent package file: $path" }
          }

          $manifest = Get-Content "artifacts\LongCapture\BrowserAgent\Extension\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Browser Agent extension is not Manifest V3" }
          $permissions = @($manifest.permissions)
          foreach ($permission in @("activeTab", "scripting", "nativeMessaging")) {
            if ($permissions -notcontains $permission) { throw "Missing extension permission: $permission" }
          }
          if ($permissions -contains "debugger" -or $manifest.host_permissions) { throw "PoC permission boundary expanded unexpectedly" }

      - name: Upload PoC package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: LongCapture-Browser-Agent-v0.1-PoC-x64
          path: artifacts\LongCapture\**
          if-no-files-found: error

      - name: Record push gate result
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tested = "${{ github.sha }}"
          $result = "${{ job.status }}"
          $branch = "${{ github.ref_name }}"
          $remoteLine = git ls-remote origin "refs/heads/$branch"
          $remote = if ($remoteLine) { ($remoteLine -split "`t")[0].Trim() } else { "" }
          if ($remote -ne $tested) {
            Write-Host "Branch moved from tested commit $tested to $remote; skip stale CI status write-back."
            exit 0
          }

          $statusPath = ".github\BrowserAgent-v01-CI-STATUS.md"
          @"
          # Browser Agent v0.1 CI status

          - Tested commit: `$tested`
          - Result: `$result`
          - Runner: `windows-2025`
          - Gate: restore + publish + deterministic Browser Agent self-test + existing QUICK + package boundary
          "@ | Set-Content -LiteralPath $statusPath -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $statusPath
          git commit -m "ci: record Browser Agent v0.1 gate $result for $tested"
          git push origin "HEAD:$branch"
