name: Apply ShareX-Mod v0.10 rolling guard settings once

on:
  push:
    branches:
      - "mod/robust-scrolling-v0.1"
    paths:
      - ".github/workflows/apply-v100-rolling-guard-settings.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mod/robust-scrolling-v0.1
          fetch-depth: 0

      - name: Add bounded rolling guard settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $settingsPath = "mod-overlay/src/ShareX.ScreenCaptureLib/ShareXModV04Settings.cs"
          $settings = [IO.File]::ReadAllText($settingsPath)
          if (-not $settings.Contains("DynamicFeedRollingGuardEnabled")) {
            $anchor = '    public int CaptureRecipeDynamicFeedMaxUnchangedPasses { get; set; } = 4;'
            if (-not $settings.Contains($anchor)) { throw "Dynamic feed settings anchor missing." }
            $block = @'
    public int CaptureRecipeDynamicFeedMaxUnchangedPasses { get; set; } = 4;
    public bool DynamicFeedRollingGuardEnabled { get; set; } = true;
    public double DynamicFeedGuardDelayRangeRatio { get; set; } = 0.55;
    public double DynamicFeedGuardMaxAgeRangeRatio { get; set; } = 2.5;
    public int DynamicFeedGuardMaxPendingRanges { get; set; } = 6;
    public int DynamicFeedGuardSemanticCountDelta { get; set; } = 2;
    public int DynamicFeedGuardImageCountDelta { get; set; } = 1;
    public int DynamicFeedGuardAuditHistoryRanges { get; set; } = 48;
'@
            $settings = $settings.Replace($anchor,$block)
            [IO.File]::WriteAllText($settingsPath,$settings,[Text.UTF8Encoding]::new($true))
          }

          $configPath = "mod-overlay/config/ShareX.Mod.v04.json"
          $config = [IO.File]::ReadAllText($configPath)
          if (-not $config.Contains('"dynamicFeedRollingGuardEnabled"')) {
            $anchor = '  "captureRecipeDynamicFeedMaxUnchangedPasses": 4,'
            if (-not $config.Contains($anchor)) { throw "Dynamic feed config anchor missing." }
            $block = @'
  "captureRecipeDynamicFeedMaxUnchangedPasses": 4,
  "dynamicFeedRollingGuardEnabled": true,
  "dynamicFeedGuardDelayRangeRatio": 0.55,
  "dynamicFeedGuardMaxAgeRangeRatio": 2.5,
  "dynamicFeedGuardMaxPendingRanges": 6,
  "dynamicFeedGuardSemanticCountDelta": 2,
  "dynamicFeedGuardImageCountDelta": 1,
  "dynamicFeedGuardAuditHistoryRanges": 48,
'@
            $config = $config.Replace($anchor,$block)
            [IO.File]::WriteAllText($configPath,$config,[Text.UTF8Encoding]::new($false))
          }
          git diff --check

      - name: Commit rolling guard settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sharex-mod-ci"
          git config user.email "sharex-mod-ci@users.noreply.github.com"
          git add mod-overlay/src/ShareX.ScreenCaptureLib/ShareXModV04Settings.cs mod-overlay/config/ShareX.Mod.v04.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(v0.10): add bounded dynamic-feed rolling guard settings"
          git push origin HEAD:mod/robust-scrolling-v0.1
