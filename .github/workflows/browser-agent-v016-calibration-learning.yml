name: LongCapture Browser Agent v0.1.6 Calibration Learning

on:
  push:
    branches: ["standalone/browser-agent-v0.1-poc"]
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/browser-agent-v016-calibration-learning.yml"
  pull_request:
    branches: ["standalone/longcapture-v0.1.9-rc6-sparse-edge-evidence"]
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/browser-agent-v016-calibration-learning.yml"
  workflow_dispatch:

concurrency:
  group: browser-agent-v016-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prebuild-quality-build-test:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6

      - name: Apply RC6 overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1",
            "scripts\apply-longcapture-v018-precut.ps1",
            "scripts\apply-longcapture-v018-trust-split-hooks.ps1",
            "scripts\apply-longcapture-v018-rc-evidence.ps1",
            "scripts\apply-longcapture-v019-recovery-tail-hooks.ps1",
            "scripts\apply-longcapture-v019-rc3-real-evidence-hooks.ps1",
            "scripts\apply-longcapture-v019-rc4-upward-alias-veto.ps1",
            "scripts\apply-longcapture-v019-rc5-downward-alias-consensus.ps1",
            "scripts\apply-longcapture-v019-rc6-sparse-edge-evidence.ps1",
            "scripts\apply-longcapture-v019-rc6-strong-direct-order.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Apply Browser Agent v0.1.6 overlays
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\apply-browser-agent-v01-poc.ps1",
            "scripts\apply-browser-agent-v012-integration.ps1",
            "scripts\apply-browser-agent-v013-main-ui.ps1",
            "scripts\apply-browser-agent-v013-quality-core.ps1",
            "scripts\apply-browser-agent-v013-core-followup.ps1",
            "scripts\apply-browser-agent-v014-prep.ps1",
            "scripts\apply-browser-agent-v014-cancel-timeline.ps1",
            "scripts\apply-browser-agent-v014-operation-log.ps1",
            "scripts\apply-browser-agent-v015-adaptive-quality.ps1",
            "scripts\apply-browser-agent-v015-global-speed-ui.ps1",
            "scripts\apply-browser-agent-v016-calibration-learning-v2.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Pre-build self-evaluation score must be 95+
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts\browser-agent-v016-quality-score.ps1 -MinimumScore 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify v0.1.6 source and permission invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-Content "LongCapture.Standalone\MainForm.cs" -Raw
          $session = Get-Content "LongCapture.Standalone\BrowserAgentCaptureSession.cs" -Raw
          $worker = Get-Content "LongCapture.Standalone\BrowserAgent\Extension\service-worker.js" -Raw
          $calib = Get-Content "LongCapture.Standalone\BrowserAgentAdaptiveCalibrationV016.cs" -Raw
          $monitor = Get-Content "LongCapture.Standalone\BrowserAgentAdaptiveMonitorV016.cs" -Raw
          $manifest = Get-Content "LongCapture.Standalone\BrowserAgent\Extension\manifest.json" -Raw | ConvertFrom-Json

          foreach ($marker in @("RunBrowserCalibrationFromUiAsync", "BeginCaptureMonitor", "EndCaptureMonitor")) {
            if (-not $main.Contains($marker)) { throw "Missing v0.1.6 main marker: $marker" }
          }
          foreach ($marker in @("BrowserAgentAdaptiveTelemetryHub.Publish", "CalibrationConfidenceEnd", "CaptureVisibleTabMs", "StabilityMaxFalseQuietMs")) {
            if (-not $session.Contains($marker)) { throw "Missing v0.1.6 session marker: $marker" }
          }
          foreach ($marker in @("BrowserAgentCalibrationProfile", "0.875 * old", "PersistenceSelfTest", "browser-agent-calibration-v016.json")) {
            if (-not $calib.Contains($marker)) { throw "Missing calibration marker: $marker" }
          }
          foreach ($marker in @("WS_EX_NOACTIVATE", "CaptureExclusion.Apply", "Effective:")) {
            if (-not $monitor.Contains($marker)) { throw "Missing live-monitor marker: $marker" }
          }
          foreach ($marker in @('protocolVersion: "0.1.6"', 'case "benchmark":', "captureVisibleTabMeasured", "maxFalseQuietMs", "MIN_CAPTURE_INTERVAL_MS - elapsed")) {
            if (-not $worker.Contains($marker)) { throw "Missing worker marker: $marker" }
          }
          if ($manifest.version -ne "0.1.6") { throw "Extension manifest is not v0.1.6" }
          $permissions = @($manifest.permissions)
          foreach ($permission in @("activeTab", "scripting", "nativeMessaging")) {
            if ($permissions -notcontains $permission) { throw "Missing permission $permission" }
          }
          if ($permissions.Count -ne 3 -or $permissions -contains "debugger" -or $manifest.host_permissions) {
            throw "Browser Agent permission boundary expanded unexpectedly"
          }

      - name: Restore and publish only after 95+ gate
        shell: pwsh
        run: |
          dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deterministic self-tests and RC6 QUICK regression
        shell: cmd
        run: |
          artifacts\LongCapture\LongCapture.exe --browser-agent-poc-self-test
          if errorlevel 1 exit /b %errorlevel%
          artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci
          if errorlevel 1 exit /b %errorlevel%

      - name: Package, extract, and retest final product
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "artifacts\LongCapture\BrowserAgent\Extension\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne "0.1.6") { throw "Packaged extension is not v0.1.6" }
          $worker = Get-Content "artifacts\LongCapture\BrowserAgent\Extension\service-worker.js" -Raw
          foreach ($marker in @('protocolVersion: "0.1.6"', "captureVisibleTabMeasured", "benchmarkCapturePipeline", "maxFalseQuietMs", "captureCancelled")) {
            if (-not $worker.Contains($marker)) { throw "Packaged worker missing $marker" }
          }

          New-Item -ItemType Directory -Force Output | Out-Null
          Copy-Item "artifacts\browser-agent-v016-quality-score.json" "Output\browser-agent-v016-quality-score.json" -Force
          $zip = "Output\LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64.sha256.txt" "$hash  LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64.zip"

          $temp = Join-Path $env:RUNNER_TEMP "longcapture-browser-agent-v016-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $temp -Force
          $process = Start-Process -FilePath (Join-Path $temp "LongCapture.exe") -ArgumentList "--browser-agent-poc-self-test" -WorkingDirectory $temp -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extracted v0.1.6 self-test failed with exit code $($process.ExitCode)" }

      - name: Upload v0.1.6 package and quality score
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64
          path: |
            Output\LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64.zip
            Output\LongCapture-Browser-Agent-v0.1.6-Calibrated-Adaptive-x64.sha256.txt
            Output\browser-agent-v016-quality-score.json
          if-no-files-found: error
