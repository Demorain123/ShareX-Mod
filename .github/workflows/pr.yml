name: Build ShareX (PR)

on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: sharex-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2025

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        configuration:
          - Release
          - Debug
          - Steam
          - MicrosoftStore
          - MicrosoftStoreDebug
        platform:
          - x64
          - ARM64
        exclude:
          # Steam configuration doesn't support ARM64
          - configuration: Steam
            platform: ARM64

    env:
      SOLUTION_FILE_PATH: ShareX.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify preinstalled .NET 10
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $sdks | ForEach-Object { Write-Host $_ }
          if (-not ($sdks | Where-Object { $_ -match '^10\.0\.' })) {
            throw "GitHub runner does not expose a .NET 10 SDK."
          }
          dotnet --version

      - name: Set PLATFORM & RUNTIME_ID
        run: |
          $platform = if ("${{ matrix.platform }}" -eq "ARM64") { "arm64" } else { "x64" }
          echo "PLATFORM=$platform" >> $env:GITHUB_ENV
          echo "RUNTIME_ID=win-$platform" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: |
          dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"
          if ("${{ matrix.platform }}" -eq "ARM64") {
            # ShareX.Setup always builds as x64, so restore win-x64 packages too
            dotnet restore --runtime "win-x64" "ShareX.Setup\ShareX.Setup.csproj"
          }

      - name: Build
        run: dotnet build --no-restore --configuration "${{ matrix.configuration }}" -p:Platform="${{ matrix.platform }}" --self-contained true /m:1 "${{ env.SOLUTION_FILE_PATH }}"
