name: Validate ShareX-Mod v0.6.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply complete overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          pwsh -NoProfile -File "scripts\run-v04-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v041-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v042-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v043-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v044-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v050-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v051-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v052-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v061-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v062-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File "scripts\apply-v064-post-hooks.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check

      - name: Verify current overlay version
        shell: pwsh
        run: |
          $version = (Get-Content "mod-overlay\VERSION" -Raw).Trim()
          if ($version -ne "0.6.4-dev") {
            throw "Expected mod-overlay/VERSION=0.6.4-dev, got '$version'."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore Release x64
        run: dotnet restore --runtime win-x64 ShareX.sln

      - name: Build Release x64
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX.sln

      - name: Build portable package
        shell: pwsh
        run: |
          & "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job "Release" -platform "x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate portable contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem "Output\*-portable-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable zip was not produced." }
          $temp = Join-Path $env:RUNNER_TEMP "sharex-mod-v064-portable"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $temp -Force
          foreach ($name in @("ShareX.exe", "ShareX.ScreenCaptureLib.dll", "ShareX.Mod.v04.json")) {
            if (-not (Get-ChildItem -Path $temp -Recurse -File -Filter $name | Select-Object -First 1)) {
              throw "Portable package is missing $name"
            }
          }

      - name: Upload v0.6.4 portable
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-Mod-v0.6.4-dev-portable-x64
          path: Output\*-portable-x64.zip
