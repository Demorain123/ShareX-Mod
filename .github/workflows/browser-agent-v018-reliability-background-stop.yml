name: LongCapture Browser Agent v0.1.8 Reliability Background Requested End (superseded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded-compatibility-check:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Use current v0.1.8 final preparation and quality gate
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts\prepare-browser-agent-v018-final.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "This workflow is retained only for manual compatibility checks. The active release gate is browser-agent-v018-final-r2.yml (Integrity Repair R3)." -ForegroundColor Yellow
