# Active integration gate. Historical ShareX-Mod workflows are preserved under .github/workflows-archive/.
name: Validate ShareX-Mod current integration

on:
  push:
    branches:
      - "mod/robust-scrolling-v0.1"
    paths:
      - "mod-overlay/**"
      - "scripts/**"
      - "ShareX.ScreenCaptureLib/**"
      - "Directory.build.targets"
      - ".github/workflows/validate-mod-current.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # GitHub's Windows Server 2025 image already includes multiple .NET 10 SDK feature bands.
    # Avoid setup-dotnet network installation here: the gate verifies a 10.x SDK is present before
    # doing any restore/build work and fails immediately if the runner image ever stops providing it.
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Report overlay version
        id: modmeta
        shell: pwsh
        run: |
          $version = (Get-Content "mod-overlay\VERSION" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Overlay VERSION is empty." }
          Write-Host "Overlay VERSION=$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          $versionJson = Get-Content "mod-overlay\config\ShareX.Mod.VERSION.json" -Raw | ConvertFrom-Json
          if ($versionJson.version -ne $version) {
            throw "Source mod version mismatch: VERSION='$version', JSON='$($versionJson.version)'."
          }
          $sourceCount = (Get-ChildItem "mod-overlay\src\ShareX.ScreenCaptureLib" -Filter *.cs -File -Recurse).Count
          Write-Host "Overlay C# sources=$sourceCount"
          if ($sourceCount -lt 1) { throw "Overlay source directory is empty." }

      - name: Verify preinstalled .NET 10
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $sdks | ForEach-Object { Write-Host $_ }
          if (-not ($sdks | Where-Object { $_ -match '^10\.0\.' })) {
            throw "GitHub runner does not expose a .NET 10 SDK."
          }
          dotnet --version

      # Fast gate: compile only ScreenCaptureLib and its project dependencies, then execute the
      # deterministic semantic/visual regression suite. This catches capture regressions before
      # paying for the full ShareX solution build and portable packaging path.
      - name: Fast semantic restore
        run: dotnet restore --runtime win-x64 ShareX.ScreenCaptureLib\ShareX.ScreenCaptureLib.csproj

      - name: Fast semantic build
        run: dotnet build ShareX.ScreenCaptureLib\ShareX.ScreenCaptureLib.csproj --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1

      - name: Fast ShareX-Mod self-tests
        shell: pwsh
        run: |
          $dll = Get-ChildItem "ShareX.ScreenCaptureLib\bin\Release" -Recurse -File -Filter "ShareX.ScreenCaptureLib.dll" |
            Where-Object { $_.FullName -match "win-x64" } |
            Select-Object -First 1
          if (-not $dll) { throw "Fast semantic build did not produce ShareX.ScreenCaptureLib.dll." }
          Write-Host "Fast test DLL=$($dll.FullName)"
          dotnet run --project "mod-overlay\tests\ShareXMod.SelfTestRunner\ShareXMod.SelfTestRunner.csproj" --configuration Release -- $dll.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Full integration remains authoritative. NuGet/project outputs populated by the fast gate are
      # reused in this same job where possible, so successful runs do not start from a cold workspace.
      - name: Restore full Release x64
        run: dotnet restore --runtime win-x64 ShareX.sln

      - name: Build full Release x64
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX.sln

      - name: Build portable
        shell: pwsh
        run: |
          & "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job "Release" -platform "x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate portable
        shell: pwsh
        run: |
          $zip = Get-ChildItem "Output\*-portable-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable zip missing." }
          $temp = Join-Path $env:RUNNER_TEMP "sharex-mod-current-portable"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $temp -Force
          foreach ($name in @("ShareX.exe", "ShareX.ScreenCaptureLib.dll", "ShareX.Mod.v04.json", "ShareX.Mod.VERSION.json")) {
            if (-not (Get-ChildItem -Path $temp -Recurse -File -Filter $name | Select-Object -First 1)) {
              throw "Portable package missing $name"
            }
          }
          $versionFile = Get-ChildItem -Path $temp -Recurse -File -Filter "ShareX.Mod.VERSION.json" | Select-Object -First 1
          $packagedVersion = (Get-Content $versionFile.FullName -Raw | ConvertFrom-Json).version
          $expectedVersion = "${{ steps.modmeta.outputs.version }}"
          if ($packagedVersion -ne $expectedVersion) {
            throw "Portable mod version mismatch: expected '$expectedVersion', got '$packagedVersion'."
          }
          Write-Host "Portable ShareX-Mod VERSION=$packagedVersion"

      # Test the exact ScreenCaptureLib that was put into the portable archive. This closes the
      # gap between testing a build output and testing the bytes the user will actually run.
      - name: Test packaged ScreenCaptureLib
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "sharex-mod-current-portable"
          $dll = Get-ChildItem -Path $temp -Recurse -File -Filter "ShareX.ScreenCaptureLib.dll" | Select-Object -First 1
          if (-not $dll) { throw "Packaged ShareX.ScreenCaptureLib.dll missing." }
          Write-Host "Packaged test DLL=$($dll.FullName)"
          Write-Host "Packaged DLL SHA256=$((Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash)"
          dotnet run --project "mod-overlay\tests\ShareXMod.SelfTestRunner\ShareXMod.SelfTestRunner.csproj" --configuration Release -- $dll.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-Mod-v${{ steps.modmeta.outputs.version }}-portable-x64
          path: Output\*-portable-x64.zip
