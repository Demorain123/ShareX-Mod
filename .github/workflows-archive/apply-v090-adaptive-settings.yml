name: Apply ShareX-Mod v0.9 adaptive template settings once

on:
  push:
    branches:
      - "mod/robust-scrolling-v0.1"
    paths:
      - ".github/workflows/apply-v090-adaptive-settings.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mod/robust-scrolling-v0.1
          fetch-depth: 0

      - name: Add adaptive template settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $settingsPath = "mod-overlay/src/ShareX.ScreenCaptureLib/ShareXModV04Settings.cs"
          $settings = [IO.File]::ReadAllText($settingsPath)
          if (-not $settings.Contains("CaptureRecipeAdaptiveTemplateEnabled")) {
            $anchor = '    public bool CaptureRecipePageLoopEnabled { get; set; } = true;'
            if (-not $settings.Contains($anchor)) { throw "Adaptive template settings anchor missing." }
            $block = @'
    public bool CaptureRecipePageLoopEnabled { get; set; } = true;
    public bool CaptureRecipeAdaptiveTemplateEnabled { get; set; } = true;
    public double CaptureRecipeAdaptiveTemplateMinSimilarity { get; set; } = 0.78;
'@
            $settings = $settings.Replace($anchor,$block)
            [IO.File]::WriteAllText($settingsPath,$settings,[Text.UTF8Encoding]::new($true))
          }

          $configPath = "mod-overlay/config/ShareX.Mod.v04.json"
          $config = [IO.File]::ReadAllText($configPath)
          if (-not $config.Contains('"captureRecipeAdaptiveTemplateEnabled"')) {
            $anchor = '  "captureRecipePageLoopEnabled": true,'
            if (-not $config.Contains($anchor)) { throw "Adaptive template config anchor missing." }
            $block = @'
  "captureRecipePageLoopEnabled": true,
  "captureRecipeAdaptiveTemplateEnabled": true,
  "captureRecipeAdaptiveTemplateMinSimilarity": 0.78,
'@
            $config = $config.Replace($anchor,$block)
            [IO.File]::WriteAllText($configPath,$config,[Text.UTF8Encoding]::new($false))
          }
          git diff --check

      - name: Commit settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sharex-mod-ci"
          git config user.email "sharex-mod-ci@users.noreply.github.com"
          git add mod-overlay/src/ShareX.ScreenCaptureLib/ShareXModV04Settings.cs mod-overlay/config/ShareX.Mod.v04.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(v0.9): add adaptive template inference settings"
          git push origin HEAD:mod/robust-scrolling-v0.1
