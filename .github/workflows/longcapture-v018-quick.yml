name: LongCapture v0.1.8 Trust Split Quick

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.8-trust-split"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v018-quick.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v018-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1",
            "scripts\apply-longcapture-v016-replay-compositor-hooks.ps1",
            "scripts\apply-longcapture-v017-anchor-continuity-hooks.ps1",
            "scripts\apply-longcapture-v018-precut.ps1",
            "scripts\apply-longcapture-v018-trust-split-hooks.ps1",
            "scripts\apply-longcapture-v018-rc-evidence.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify v0.1.8 structural invariants
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $main = Get-Content "LongCapture.Standalone\MainForm.cs" -Raw
          $replay = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModReplayDiagnostics.cs" -Raw
          $quality = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModFinalQualitySummary.cs" -Raw

          foreach ($required in @(
            "ShareXModTransitionResolverV018.TryResolve",
            "ShareXModTrustSplitCompositorV018.TryAppendLive",
            "modV018HoldReliableReference",
            "legacy fallback is structurally disabled"
          )) { if ($manager -notmatch [regex]::Escape($required)) { throw "Missing v0.1.8 manager invariant: $required" } }

          foreach ($forbidden in @(
            "modRobustSession.TryFallbackCombine(",
            "modRobustSession?.ShouldContinueAfterCombineFailure()",
            "ShareXModDelayedCompositorV016.TryAppendLive("
          )) { if ($manager.Contains($forbidden)) { throw "Forbidden legacy live path remains: $forbidden" } }

          if ($automation -notmatch [regex]::Escape("ShareXModV018TrustSplitSelfTests")) { throw "v0.1.8 trust-split regression missing from QUICK" }
          if ($main -notmatch [regex]::Escape("v0.1.8 RC automatic replay evidence")) { throw "RC raw replay evidence is not automatic" }
          foreach ($required in @("ShareXModTrustSplitCompositorV018.Session", "LongCapture-Replay-v018", 'version = "0.1.8"')) {
            if ($replay -notmatch [regex]::Escape($required)) { throw "v0.1.8 replay gate missing: $required" }
          }
          foreach ($required in @("transitionV018", "trustSplitV018", "PixelOverlayRepairEnabled")) {
            if ($quality -notmatch [regex]::Escape($required)) { throw "v0.1.8 quality gate missing: $required" }
          }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact Quick acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Validate v0.1.8 regression and readiness
        shell: pwsh
        run: |
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK failed" }
          $fixture = $data.Cases | Where-Object { $_.Detail -match "v0.1.8 trust-split passed" } | Select-Object -First 1
          if (-not $fixture) { throw "v0.1.8 trust-split fixture did not run" }
          foreach ($required in @("accepted-mosaic immutable", "pixelOverlayRepair=off", "one-gap two-step catch-up validated", "legacy fallback forbidden")) {
            if ($fixture.Detail -notmatch [regex]::Escape($required)) { throw "v0.1.8 fixture missing assertion: $required" }
          }
          Remove-Item "artifacts\LongCapture\AutomationReports" -Recurse -Force

          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v7"
            version = "0.1.8-rc1"
            status = "READY_FOR_REAL_TEST_1"
            mandatoryAutomatedGates = "PASS"
            automatedScore = 82
            scoreCapReason = "Real Linux.do Test 1 has not yet passed; automated score is intentionally capped below 90."
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            architecture = @(
              "single geometry authority; legacy TryFallbackCombine removed",
              "accepted raster mosaic is immutable",
              "generic raster path does not auto-repair fixed/sticky pixels",
              "one rejected transition may hold the last reliable reference for one validated two-step catch-up",
              "offline replay uses the same v0.1.8 resolver/compositor",
              "RC real captures record raw replay evidence automatically"
            )
            realTestRequired = @(
              "Repeat Linux.do Test 1 once; do not run Test 2 unless Test 1 passes",
              "If Test 1 fails, export diagnostics; v0.1.8 RC should contain replayable raw frames without requiring the Debug checkbox"
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package v0.1.8 RC1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.8-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.8-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.8-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun Quick
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v018-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.8-rc1-x64.zip" $temp -Force
          if (-not (Test-Path (Join-Path $temp "Replay-Last-Capture.ps1"))) { throw "Replay helper missing from final ZIP" }
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.8 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $data = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "Extracted v0.1.8 report failed" }

      - name: Upload v0.1.8 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.8-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.8-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.8-rc1-x64.sha256.txt
