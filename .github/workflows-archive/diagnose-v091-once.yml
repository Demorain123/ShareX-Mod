name: Diagnose ShareX-Mod v0.9.1 once

on:
  push:
    branches:
      - "mod/robust-scrolling-v0.1"
    paths:
      - ".github/workflows/diagnose-v091-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mod/robust-scrolling-v0.1
          fetch-depth: 0

      - name: Wait for v0.9.1 integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($i = 1; $i -le 75; $i++) {
            git fetch origin mod/robust-scrolling-v0.1
            git reset --hard origin/mod/robust-scrolling-v0.1
            $version = (Get-Content "mod-overlay\VERSION" -Raw).Trim()
            if ($version -eq "0.9.1-dev") { exit 0 }
            Write-Host "Waiting for v0.9.1 ($i/75), current=$version"
            Start-Sleep -Seconds 10
          }
          throw "v0.9.1 did not integrate before timeout."

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Compile and capture actionable diagnostics
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force "ci-diagnostics" | Out-Null
          $full = "ci-diagnostics\v091-full.log"
          $summary = "ci-diagnostics\v091.txt"
          "ShareX-Mod v0.9.1 diagnostic`nGenerated: $(Get-Date -Format o)`n" | Set-Content $full

          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1"
          )

          $failed = $false
          foreach ($hook in $hooks) {
            "`n=== $hook ===" | Tee-Object -FilePath $full -Append
            & pwsh -NoProfile -File $hook 2>&1 | Tee-Object -FilePath $full -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true; break }
          }

          if (-not $failed) {
            "`n=== restore ===" | Tee-Object -FilePath $full -Append
            dotnet restore --runtime win-x64 ShareX.sln 2>&1 | Tee-Object -FilePath $full -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if (-not $failed) {
            "`n=== build ===" | Tee-Object -FilePath $full -Append
            dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX.sln 2>&1 | Tee-Object -FilePath $full -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          $lines = Get-Content $full
          $important = $lines | Where-Object {
            $_ -match 'error CS\d+' -or
            $_ -match 'error MSB\d+' -or
            $_ -match 'compatibility check failed' -or
            $_ -match 'anchor not found' -or
            $_ -match 'Hook target not found' -or
            $_ -match 'Build FAILED'
          }

          if ($failed) {
            @(
              "STATUS: FAIL",
              "",
              "Key errors:",
              ($important | Select-Object -First 180),
              ""
            ) | Set-Content $summary
          }
          else {
            @(
              "STATUS: PASS",
              "",
              "Overlay replay + Release x64 compilation succeeded."
            ) | Set-Content $summary
          }

          Remove-Item $full -Force -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }

      - name: Commit diagnostic summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci-diagnostics/v091.txt ]; then
            mkdir -p ci-diagnostics
            printf 'STATUS: DIAGNOSTIC_WORKFLOW_FAILED\n' > ci-diagnostics/v091.txt
          fi
          git config user.name "sharex-mod-ci"
          git config user.email "sharex-mod-ci@users.noreply.github.com"
          git add ci-diagnostics/v091.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record v0.9.1 compile diagnostic"
          git push origin HEAD:mod/robust-scrolling-v0.1
