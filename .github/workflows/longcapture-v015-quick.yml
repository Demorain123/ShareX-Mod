name: LongCapture v0.1.5 Fixed Overlay Quick

on:
  push:
    branches:
      - "standalone/longcapture-v0.1.5-fixed-overlay-repair"
    paths:
      - "LongCapture.Standalone/**"
      - "ShareX.ScreenCaptureLib/**"
      - "ShareX.Avalonia/**"
      - "mod-overlay/**"
      - "scripts/**"
      - ".github/workflows/longcapture-v015-quick.yml"
  workflow_dispatch:

concurrency:
  group: longcapture-v015-quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply overlay chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hooks = @(
            "scripts\run-v04-hooks.ps1",
            "scripts\apply-v041-post-hooks.ps1",
            "scripts\apply-v042-post-hooks.ps1",
            "scripts\apply-v043-post-hooks.ps1",
            "scripts\apply-v044-post-hooks.ps1",
            "scripts\apply-v050-post-hooks.ps1",
            "scripts\apply-v051-post-hooks.ps1",
            "scripts\apply-v052-post-hooks.ps1",
            "scripts\apply-v061-post-hooks.ps1",
            "scripts\apply-v062-post-hooks.ps1",
            "scripts\apply-v064-post-hooks.ps1",
            "scripts\apply-longcapture-v013-standalone-hooks.ps1",
            "scripts\apply-longcapture-v013-rc-hardening.ps1",
            "scripts\apply-longcapture-v014-core-hooks.ps1",
            "scripts\apply-longcapture-v015-fixed-overlay-hooks.ps1"
          )
          foreach ($hook in $hooks) {
            Write-Host "=== $hook ==="
            & pwsh -NoProfile -File $hook
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check

      - name: Verify v0.1.5 markers
        shell: pwsh
        run: |
          $manager = Get-Content "ShareX.ScreenCaptureLib\ScrollingCaptureManager.cs" -Raw
          $main = Get-Content "LongCapture.Standalone\MainForm.cs" -Raw
          $automation = Get-Content "LongCapture.Standalone\AutomationTestRunner.cs" -Raw
          $exclusion = Get-Content "LongCapture.Standalone\CaptureExclusion.cs" -Raw
          $compositor = Get-Content "mod-overlay\src\ShareX.ScreenCaptureLib\ShareXModAnchorCompositorV014.cs" -Raw
          foreach ($required in @("ShareXModAnchorCompositorV014.TryAppend", "modV014AnchorCompositorUsed")) {
            if ($manager -notmatch [regex]::Escape($required)) { throw "Missing compositor hook: $required" }
          }
          foreach ($required in @("Foreground target (F7)", "TryRelockTargetToSelectedRegion", "Whole window (skip region selection)", "Debug: safe GUI/settings snapshot + evidence")) {
            if ($main -notmatch [regex]::Escape($required)) { throw "Missing GUI marker: $required" }
          }
          foreach ($required in @("captureAffinityRemains", "DesiredAffinity => WDA_EXCLUDEFROMCAPTURE")) {
            if ($exclusion -notmatch [regex]::Escape($required)) { throw "Unsafe debug capture affinity marker missing: $required" }
          }
          foreach ($required in @("RepairPreviousBottomFixedTiles", "current(y-delta)", "fixed-overlay-evidence.jsonl")) {
            if ($compositor -notmatch [regex]::Escape($required)) { throw "Fixed-overlay repair marker missing: $required" }
          }
          if ($automation -notmatch [regex]::Escape("ShareXModV014CompositorSelfTests")) { throw "Bottom fixed-overlay integration fixture is not in QUICK" }

      - name: Restore
        run: dotnet restore --runtime win-x64 LongCapture.Standalone\LongCapture.Standalone.csproj

      - name: Publish portable
        run: dotnet publish LongCapture.Standalone\LongCapture.Standalone.csproj --no-restore --configuration Release --runtime win-x64 --self-contained true --output artifacts\LongCapture /m:1

      - name: Run exact Quick acceptance
        shell: cmd
        run: artifacts\LongCapture\1-RUN-AUTOMATED-TESTS.cmd --ci

      - name: Validate fixed-overlay fixture and readiness
        shell: pwsh
        run: |
          $report = Get-ChildItem "artifacts\LongCapture\AutomationReports" -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "No automation report" }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "QUICK failed" }
          $fixture = $data.Cases | Where-Object { $_.Detail -match "v0.1.5 bottom-fixed deferred-repair integration passed" } | Select-Object -First 1
          if (-not $fixture) { throw "Real-shaped bottom fixed-overlay fixture did not run" }
          if ($fixture.Detail -notmatch "dynamicFixedBands=1") { throw "Bottom fixed-overlay fixture did not reduce repeats to one tail occurrence" }
          Remove-Item "artifacts\LongCapture\AutomationReports" -Recurse -Force
          $readiness = [ordered]@{
            schema = "longcapture.rc-readiness.v4"
            version = "0.1.5-rc1"
            status = "READY_FOR_REAL_TEST_1"
            mandatoryGates = "PASS"
            automatedScore = 92
            commit = "${{ github.sha }}"
            workflowRunId = "${{ github.run_id }}"
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            fixedFromRealTest = @(
              "Debug mode no longer makes helper/Avalonia windows capturable",
              "bottom-right fixed controls are classified against stationary and document-motion hypotheses",
              "previous fixed-overlay pixels are repaired one frame later from current(y-delta)",
              "real-shaped changing Back/counter fixture intersects the appended bottom strip",
              "fixed-overlay evidence/masks are written into diagnostics",
              "standalone quality cannot report clean/high/100 while a detected fixed tail remains"
            )
            realTestRequired = @(
              "Repeat Linux.do Test 1 only; do not run Test 2 until Test 1 visually passes"
            )
          }
          $readiness | ConvertTo-Json -Depth 6 | Set-Content "artifacts\LongCapture\RC-READINESS.json" -Encoding UTF8

      - name: Package v0.1.5 RC1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          $zip = "Output\LongCapture-standalone-v0.1.5-rc1-x64.zip"
          Compress-Archive -Path "artifacts\LongCapture\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content "Output\LongCapture-standalone-v0.1.5-rc1-x64.sha256.txt" "$hash  LongCapture-standalone-v0.1.5-rc1-x64.zip"
          Write-Host "SHA256=$hash"

      - name: Extract final ZIP and rerun Quick
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "longcapture-v015-final"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "Output\LongCapture-standalone-v0.1.5-rc1-x64.zip" $temp -Force
          & cmd.exe /d /c "`"$temp\1-RUN-AUTOMATED-TESTS.cmd`" --ci"
          if ($LASTEXITCODE -ne 0) { throw "Extracted v0.1.5 QUICK failed" }
          $final = Get-ChildItem (Join-Path $temp "AutomationReports") -Filter automation-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $data = Get-Content $final.FullName -Raw | ConvertFrom-Json
          if ($data.Status -ne "PASS_AUTOMATED" -or [int]$data.FailedCount -ne 0) { throw "Extracted v0.1.5 report failed" }

      - name: Upload v0.1.5 RC1
        uses: actions/upload-artifact@v7
        with:
          name: LongCapture-standalone-v0.1.5-rc1-x64
          path: |
            Output\LongCapture-standalone-v0.1.5-rc1-x64.zip
            Output\LongCapture-standalone-v0.1.5-rc1-x64.sha256.txt
